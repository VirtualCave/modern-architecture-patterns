spring:
  application:
    name: hexagonal-tutorial

  # Virtual Threads: Spring Boot 4 los habilita por defecto.
  # Esto permite que cada request HTTP se ejecute en un hilo virtual (Project Loom),
  # lo que escala mejor que los hilos de plataforma tradicionales.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:hexagonaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

logging:
  level:
    com.tutorial.hexagonal: DEBUG

