spring:
  application:
    name: ddd-tutorial
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:ddddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8083

logging:
  level:
    com.tutorial.ddd: DEBUG

